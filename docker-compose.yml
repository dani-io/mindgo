services:
  app:
    build:
      context: .
    ports:
      - "${APP_PORT:-3001}:3000"
    environment:
      - DATABASE_URL=postgresql://mindgo:${DB_PASSWORD}@db:5432/mindgo
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - NEXT_PUBLIC_APP_NAME=Mindgo
      - JWT_EXPIRY=24h
      - SMS_PROVIDER=${SMS_PROVIDER}
      - SMS_SELFHOSTED_URL=${SMS_SELFHOSTED_URL}
      - SMS_SELFHOSTED_KEY=${SMS_SELFHOSTED_KEY}
      - TEST_PHONES=${TEST_PHONES}
      - STORAGE_PROVIDER=local
      - LOCAL_UPLOAD_DIR=/app/uploads
      - JITSI_DOMAIN=${JITSI_DOMAIN:-meet.jit.si}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mindgo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: mindgo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindgo -d mindgo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
