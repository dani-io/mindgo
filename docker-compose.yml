services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://postgres:mindgo_secure_pass_2026@db:5432/mindgo
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://mindgo.ir}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://mindgo.ir}
      - NEXT_PUBLIC_APP_NAME=Mindgo
      - JWT_EXPIRY=24h
      - SMS_PROVIDER=${SMS_PROVIDER:-selfhosted}
      - SMS_SELFHOSTED_URL=${SMS_SELFHOSTED_URL:-http://192.168.10.90:8080}
      - SMS_SELFHOSTED_KEY=${SMS_SELFHOSTED_KEY}
      - TEST_PHONES=${TEST_PHONES:-09179498400,09033026179,09332707858,09172908477}
      - STORAGE_PROVIDER=local
      - JITSI_DOMAIN=${JITSI_DOMAIN:-meet.jit.si}
    volumes:
      # Uploaded files live on the host and are served by Next.js at /uploads/*
      - ./uploads:/app/public/uploads
    healthcheck:
      # 127.0.0.1, not localhost: localhost resolves to ::1 in this image while
      # the Next.js server binds IPv4, so the IPv6 attempt is refused.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - mindgo-net

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mindgo_secure_pass_2026
      - POSTGRES_DB=mindgo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - mindgo-net

volumes:
  postgres_data:

networks:
  mindgo-net:
    driver: bridge
