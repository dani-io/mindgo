services:
  db:
    image: postgres:16-alpine
    container_name: mindgo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mindgo_db
      POSTGRES_USER: mindgo
      POSTGRES_PASSWORD: mindgo_secret_2024
    ports:
      - "5432:5432"
    volumes:
      - mindgo_data:/var/lib/postgresql/data

volumes:
  mindgo_data:
